# tfhe-hpu-backend maps its copy-back (board -> host) buffers on 2 MiB huge pages,
# one per ciphertext PC, taken from the reserved hugetlb pool. Without a pool the
# backend falls back to 4 KiB pages and logs a warning at each copy-back.
#
# This file must be copied once into /etc/sysctl.d/ (it survives reboots)
# then you need to do :
# sudo sysctl --system
#
# 1152 pages = 2304 MiB, check with: grep HugePages_ /proc/meminfo

vm.nr_hugepages = 1152
